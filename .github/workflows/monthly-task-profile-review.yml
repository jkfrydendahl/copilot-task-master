name: Monthly task profile review

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      force_benchmark_consensus:
        description: >-
          One-time manual override: apply a qualifying benchmark challenger
          immediately on this run instead of waiting for a second distinct
          source publication. Does not bypass any other eligibility, cost,
          or source-completeness guardrail. Always false on scheduled runs.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        shell: pwsh
        run: npm install --global @github/copilot

      - name: Run tests
        shell: pwsh
        run: .\scripts\test-all.ps1

      - name: Generate review report
        shell: pwsh
        run: .\scripts\review-task-profiles.ps1
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BENCHMARK_CONSENSUS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_benchmark_consensus || 'false' }}

      - name: Create/update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/monthly-task-profile-review
          title: "chore: monthly task profile review"
          commit-message: "chore: update monthly task profile review report"
          add-paths: |
            reports/task-profile-review.md
            task-profiles.json
            data/model-ranking-snapshot.json
          body: |
            Automated monthly review for `task-profiles.json`.

            Includes:
            - current profile matrix
            - direct model suggestions per task class (in report)
            - automatic application of suggested model changes in `task-profiles.json`
            - invalid/deprecated model handling (if CLI model list is available)
            - newly available model candidates
            - required manual check against:
              https://docs.github.com/en/copilot/reference/ai-models/model-comparison
